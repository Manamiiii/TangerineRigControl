name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild TangerineRigControl.sln /p:Configuration=Release /m
      - name: Run self-test
        shell: pwsh
        run: |
          $process = Start-Process src/TangerineRigControl/bin/Release/TangerineRigControl.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: TangerineRigControl-windows-portable
          path: src/TangerineRigControl/bin/Release/TangerineRigControl.exe
          if-no-files-found: error
