name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild TangerineRigControl.sln /p:Configuration=Release /m
      - name: Run self-test
        shell: pwsh
        run: |
          $process = Start-Process src/TangerineRigControl/bin/Release/TangerineRigControl.exe -ArgumentList '--self-test' -PassThru -RedirectStandardOutput self-test.out -RedirectStandardError self-test.err
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Self-test timed out after 60 seconds.' }
          $process.WaitForExit()
          Get-Content self-test.out,self-test.err
          Write-Output "Self-test exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: TangerineRigControl-windows-portable
          path: src/TangerineRigControl/bin/Release/TangerineRigControl.exe
          if-no-files-found: error
